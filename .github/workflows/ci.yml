name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catch breaking Home Assistant changes early

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system pytest-homeassistant-custom-component pycryptodome ruff
      - run: ruff check .
      - run: node --check custom_components/haodeng_mesh/frontend/haodeng-light-card.js
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
